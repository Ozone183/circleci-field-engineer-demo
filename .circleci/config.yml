version: 2.1

# Use AWS ECR orb for OIDC authentication
orbs:
  aws-ecr: circleci/aws-ecr@9.0.4

# Define reusable executors
executors:
  docker-builder:
    docker:
      - image: cimg/python:3.11
    resource_class: medium

# Define jobs
jobs:
  # Job 1: Build and test
  build_and_test:
    docker:
      - image: cimg/python:3.11
        environment:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/circleci_demo
          FLASK_ENV: testing
      # PostgreSQL sidecar container
      - image: cimg/postgres:15.3
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: circleci_demo
    
    steps:
      - checkout
      
      # Install dependencies
      - run:
          name: Install Python dependencies
          command: |
            pip install --upgrade pip
            pip install -r app/requirements.txt
      
      # Wait for PostgreSQL to be ready
      - run:
          name: Wait for PostgreSQL
          command: |
            dockerize -wait tcp://localhost:5432 -timeout 1m
      
      # Initialize database
      - run:
          name: Initialize database
          command: |
            export PYTHONPATH=$PWD
            python3 scripts/init_db.py
      
      # Run tests
      - run:
          name: Run pytest
          command: |
            export PYTHONPATH=$PWD
            pytest tests/ -v --junitxml=test-results/junit.xml --cov=app --cov-report=html --cov-report=term
      
      # Store test results
      - store_test_results:
          path: test-results
      
      # Store coverage report
      - store_artifacts:
          path: htmlcov
          destination: coverage-report
      
      # Persist workspace for next job
      - persist_to_workspace:
          root: .
          paths:
            - .

  # Job 2: Build and push Docker image to ECR with OIDC
  build_and_push_image:
    executor: docker-builder
    
    steps:
      - attach_workspace:
          at: .
      
      - setup_remote_docker:
          docker_layer_caching: true
      
      # Authenticate to AWS ECR using OIDC
      - aws-ecr/ecr_login:
          role_arn: arn:aws:iam::421765950566:role/CircleCI-OIDC-ECR-Role
          region: us-east-2
      
      # Build Docker image
      - run:
          name: Build Docker image
          command: |
            docker build -t circleci-demo-api:${CIRCLE_SHA1} .
            docker tag circleci-demo-api:${CIRCLE_SHA1} \
              421765950566.dkr.ecr.us-east-2.amazonaws.com/circleci-demo-api:${CIRCLE_SHA1}
            docker tag circleci-demo-api:${CIRCLE_SHA1} \
              421765950566.dkr.ecr.us-east-2.amazonaws.com/circleci-demo-api:latest
      
      # Test Docker image
      - run:
          name: Test Docker image
          command: |
            docker run -d --name test-container \
              -e DATABASE_URL=postgresql://postgres:password@localhost:5432/circleci_demo \
              circleci-demo-api:${CIRCLE_SHA1}
            sleep 5
            docker logs test-container
            docker stop test-container
      
      # Push to ECR (conditional - only on main branch)
      - when:
          condition:
            equal: [ main, << pipeline.git.branch >> ]
          steps:
            - run:
                name: Push to Amazon ECR
                command: |
                  docker push 421765950566.dkr.ecr.us-east-2.amazonaws.com/circleci-demo-api:${CIRCLE_SHA1}
                  docker push 421765950566.dkr.ecr.us-east-2.amazonaws.com/circleci-demo-api:latest
            
            - run:
                name: Deployment summary
                command: |
                  echo "✅ Image pushed to Amazon ECR:"
                  echo "   421765950566.dkr.ecr.us-east-2.amazonaws.com/circleci-demo-api:${CIRCLE_SHA1}"
                  echo "   421765950566.dkr.ecr.us-east-2.amazonaws.com/circleci-demo-api:latest"

# Define workflows
workflows:
  version: 2
  build_test_deploy:
    jobs:
      - build_and_test
      - build_and_push_image:
          requires:
            - build_and_test
          # Only run on main branch
          filters:
            branches:
              only: main
          # Enable OIDC context
          context: 
            - circleci-oidc