version: 2.1

# Define reusable executors
executors:
  docker-builder:
    docker:
      - image: cimg/python:3.11
    resource_class: medium

# Define reusable commands
commands:
  setup_docker:
    description: "Setup remote Docker environment"
    steps:
      - setup_remote_docker:
          docker_layer_caching: true

# Define jobs
jobs:
  # Job 1: Build and test
  build_and_test:
    docker:
      - image: cimg/python:3.11
        environment:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/circleci_demo
          FLASK_ENV: testing
      # PostgreSQL sidecar container
      - image: cimg/postgres:15.3
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: circleci_demo
    
    steps:
      - checkout
      
      # Install dependencies
      - run:
          name: Install Python dependencies
          command: |
            pip install --upgrade pip
            pip install -r app/requirements.txt
      
      # Wait for PostgreSQL to be ready
      - run:
          name: Wait for PostgreSQL
          command: |
            dockerize -wait tcp://localhost:5432 -timeout 1m
      
      # Initialize database
      - run:
          name: Initialize database
          command: |
            export PYTHONPATH=$PWD
            python3 scripts/init_db.py
      
      # Run tests
      - run:
          name: Run pytest
          command: |
            export PYTHONPATH=$PWD
            pytest tests/ -v --junitxml=test-results/junit.xml --cov=app --cov-report=html --cov-report=term
      
      # Store test results
      - store_test_results:
          path: test-results
      
      # Store coverage report
      - store_artifacts:
          path: htmlcov
          destination: coverage-report
      
      # Persist workspace for next job
      - persist_to_workspace:
          root: .
          paths:
            - .

  # Job 2: Build Docker image
  build_docker_image:
    executor: docker-builder
    
    steps:
      - attach_workspace:
          at: .
      
      - setup_docker
      
      - run:
          name: Build Docker image
          command: |
            docker build -t circleci-demo-api:${CIRCLE_SHA1} .
            docker tag circleci-demo-api:${CIRCLE_SHA1} circleci-demo-api:latest
      
      - run:
          name: Test Docker image
          command: |
            docker run -d --name test-container \
              -e DATABASE_URL=postgresql://postgres:password@localhost:5432/circleci_demo \
              circleci-demo-api:${CIRCLE_SHA1}
            sleep 5
            docker logs test-container
            docker stop test-container
      
      - run:
          name: Save Docker image to tar
          command: |
            mkdir -p /tmp/docker-images
            docker save circleci-demo-api:${CIRCLE_SHA1} -o /tmp/docker-images/api-image.tar
      
      - persist_to_workspace:
          root: /tmp/docker-images
          paths:
            - api-image.tar

  # Job 3: Publish Docker image (only on main branch)
  publish_image:
    executor: docker-builder
    
    steps:
      - attach_workspace:
          at: /tmp/docker-images
      
      - setup_docker
      
      - run:
          name: Load Docker image
          command: |
            docker load -i /tmp/docker-images/api-image.tar
      
      # Conditional: Only publish on main branch
      - when:
          condition:
            equal: [ main, << pipeline.git.branch >> ]
          steps:
            - run:
                name: Login to Docker Hub
                command: |
                  echo "$MY_PASSWORD" | docker login -u "$MY_USERNAME" --password-stdin
            
            - run:
                name: Push to Docker Hub
                command: |
                  docker tag circleci-demo-api:${CIRCLE_SHA1} ${MY_USERNAME}/circleci-demo-api:${CIRCLE_SHA1}
                  docker tag circleci-demo-api:${CIRCLE_SHA1} ${MY_USERNAME}/circleci-demo-api:latest
                  docker push ${MY_USERNAME}/circleci-demo-api:${CIRCLE_SHA1}
                  docker push ${MY_USERNAME}/circleci-demo-api:latest
            
            - run:
                name: Deployment summary
                command: |
                  echo "✅ Image published to Docker Hub:"
                  echo "   ${MY_USERNAME}/circleci-demo-api:${CIRCLE_SHA1}"
                  echo "   ${MY_USERNAME}/circleci-demo-api:latest"


# Define workflows
workflows:
  version: 2
  build_test_deploy:
    jobs:
      - build_and_test
      - build_docker_image:
          requires:
            - build_and_test
      - publish_image:
          requires:
            - build_docker_image
          # Only run on main branch
          filters:
            branches:
              only: main