version: '3.8'

services:
  # Postgres database
  db:
    image: postgres:15-alpine
    container_name: circleci-demo-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: circleci_demo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Flask API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: circleci-demo-api
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/circleci_demo
      FLASK_ENV: development
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
      - ./scripts:/app/scripts

volumes:
  postgres_data:
